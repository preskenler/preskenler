services:
  db:
    image: mysql:8.4.11-oraclelinux9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: preskenler
      MYSQL_USER: preskenler
      MYSQL_PASSWORD: preskenler
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preskenler-app
    restart: unless-stopped
    command: sh -c "npm run db:deploy && npm run dev"
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: mysql://root:root@db:3306/preskenler
      # Keep the stack self-contained for e2e; override in real deployments.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-compose-secret-change-me-0000000000}
      BETTER_AUTH_URL: http://localhost:3000
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    develop:
      watch:
        # Source changes are synced straight into the running container.
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - generated/
        - action: sync
          path: ./public
          target: /app/public
        # Next.js config changes require a restart to take effect.
        - action: sync+restart
          path: ./next.config.mjs
          target: /app/next.config.mjs
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        # Dependency, Dockerfile and Prisma changes require a full rebuild.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./prisma

volumes:
  db_data:
