services:
  db:
    image: mysql:8.4.11-oraclelinux9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: preskenler
      MYSQL_USER: preskenler
      MYSQL_PASSWORD: preskenler
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preskenler-app
    restart: unless-stopped
    command: sh -c "npm run db:deploy && npm run dev"
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: mysql://root:root@db:3306/preskenler
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    volumes:
      # Bind-mount the sources for hot reload...
      - .:/app
      # ...but keep container-owned node_modules, build output and generated
      # Prisma client so they survive the bind mount and stay in sync with the
      # Linux image rather than the host.
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
