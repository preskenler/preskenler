name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Placeholder values so `prisma generate` (postinstall) and `next build` can
  # initialize Prisma/Better Auth. Steps that hit the database use the service
  # container below.
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/preskenler
  BETTER_AUTH_SECRET: ci-not-a-real-secret-000000000000000000000000
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  check:
    name: Lint, typecheck, format, test and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.11-oraclelinux9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: preskenler
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Check for schema drift
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npm run type:gen

      - name: Typecheck
        run: npm run type:check

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e
